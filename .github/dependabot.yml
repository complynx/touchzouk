version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/testing"
    schedule:
      interval: "weekly"
    groups:
      go-toolchain:
        patterns:
          - "golang"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
