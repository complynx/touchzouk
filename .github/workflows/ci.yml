name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOUCHZOUK_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/touchzouk_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: touchzouk_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d touchzouk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Go release
        id: go
        run: |
          echo "version=$(awk '/^go / {split($2, v, "."); print v[1] "." v[2] ".x"}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Run formatters and linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Check known vulnerabilities
        run: go tool govulncheck ./...

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: go build ./...
