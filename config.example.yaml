server:
  address: "127.0.0.1:8080"
  public_url: "http://localhost:8080"

data_dir: "./data"
site_dir: "./site"

database:
  driver: "sqlite"
  dsn: "./data/touchzouk.db"

media:
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  max_upload_mb: 1024
  waveform_points: 1024

# Local and automated tests use a deliberately explicit stub identity. Container
# deployments supply their own authentication configuration.
auth:
  mode: "stub"
  session_secret: "local-development-only-change-me"
  stub_user: "Local administrator"
  secure_cookies: false
