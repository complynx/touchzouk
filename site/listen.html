<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b16">
  <meta name="description" content="Sound Atlas — sets and songs selected by DJ Touchzouk.">
  <title>Sound Atlas · DJ Touchzouk</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png?v=6">
  <link rel="icon" type="image/png" sizes="128x128" href="/static/touchzouk-logo.png?v=6">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Manrope:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=23">
  <link rel="stylesheet" href="atlas.css?v=44">
</head>
<body class="atlas-body">
  <a class="skip-link" href="#atlas-catalog">Skip to music</a>

  <header class="site-header atlas-header">
    <a class="brand" href="/" aria-label="DJ Touchzouk home"><img src="static/touchzouk-wordmark.svg" width="158" height="27" alt=""></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span class="sr-only">Open menu</span></button>
    <nav id="site-nav" class="site-nav" aria-label="Sound Atlas navigation"><a href="/">Home</a><a href="https://t.me/touchzouk" target="_blank" rel="noreferrer">Channel</a></nav>
    <a class="atlas-admin-link" href="/admin">Admin <span aria-hidden="true">↗</span></a>
  </header>

  <main id="atlas-main" class="atlas-main">
    <div class="atlas-sky" aria-hidden="true"><canvas data-atlas-sky></canvas></div>
    <section class="atlas-intro" aria-labelledby="atlas-title">
      <h1 id="atlas-title" data-shine>Sound Atlas</h1>
      <p class="atlas-lede">A cosmic archive of sets, journeys and emotions.</p>
    </section>

    <div class="atlas-catalog" id="atlas-catalog" data-catalog-tabs data-active-kind="set">
      <div class="mobile-category-tabs" aria-label="Sound Atlas category, showing Sets">
        <button class="is-active" type="button" data-mobile-tab="set" aria-controls="sets" aria-pressed="true" aria-label="Sets selected">Sets</button>
        <button type="button" data-mobile-tab="song" aria-controls="songs" aria-pressed="false" aria-label="Show Songs">Songs</button>
      </div>
      <section class="atlas-shelf" id="sets" data-catalog-panel="set" aria-labelledby="sets-title">
        <header class="shelf-heading"><h2 id="sets-title" tabindex="-1">Sets</h2><em class="shelf-count" data-count="set">—</em></header>
        <div class="media-list" id="sets-list" data-list="set" aria-live="polite"><div class="atlas-loading"><i></i><span>Charting the sets…</span></div></div>
      </section>

      <section class="atlas-shelf" id="songs" data-catalog-panel="song" aria-labelledby="songs-title">
        <header class="shelf-heading"><h2 id="songs-title" tabindex="-1">Songs</h2><em class="shelf-count" data-count="song">—</em></header>
        <div class="media-list" id="songs-list" data-list="song" aria-live="polite"><div class="atlas-loading"><i></i><span>Finding the songs…</span></div></div>
      </section>
    </div>
    <p class="sr-only" data-catalog-status aria-live="polite"></p>
  </main>

  <section class="atlas-player media-surface" data-player aria-label="Audio player">
    <div class="player-idle" data-player-idle>
      <span aria-hidden="true">✦</span><p><strong>Select a point on the atlas</strong><small>A set or song will appear here</small></p>
      <label class="volume-control idle-volume"><span class="sr-only">Volume</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9.5c1.3 1.4 1.3 3.6 0 5M18.5 7c2.7 2.8 2.7 7.2 0 10"></path></svg><input data-volume type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" aria-valuetext="80 percent"></label>
    </div>

    <div class="player-loaded" data-player-loaded hidden>
      <div class="now-cover media-artwork"><img data-now-cover src="" alt=""></div>
      <div class="player-topline">
        <div class="now-copy track-copy"><span data-now-kind>Set</span><strong data-now-title>—</strong><small data-now-subtitle></small></div>
        <div class="now-controls" aria-label="Playback controls">
          <button class="icon-control" type="button" data-random aria-label="Shuffle current list" title="Shuffle"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h5M18 14l3 3-3 3M3 17h3c1.4 0 2.6-1.2 3.7-2.8M14.4 9.7C15 8.2 15.8 7 18 7h3M18 4l3 3-3 3"></path></svg></button>
          <button class="icon-control" type="button" data-previous aria-label="Previous item"><img src="static/icon-skip-back.svg" width="17" height="17" alt=""></button>
          <button class="icon-control play-control" type="button" data-main-play aria-label="Play"><span></span></button>
          <button class="icon-control" type="button" data-next aria-label="Next item"><img src="static/icon-skip-forward.svg" width="17" height="17" alt=""></button>
          <button class="icon-control" type="button" data-repeat aria-label="Repeat off" aria-pressed="false" title="Repeat"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"></path></svg><small data-repeat-one>1</small></button>
          <button class="icon-control share-control" type="button" data-share aria-label="Copy track link" title="Share" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"></path></svg></button>
          <label class="volume-control"><span class="sr-only">Volume</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9.5c1.3 1.4 1.3 3.6 0 5M18.5 7c2.7 2.8 2.7 7.2 0 10"></path></svg><input data-volume type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" aria-valuetext="80 percent"></label>
        </div>
        <span class="sr-only" data-share-status aria-live="polite"></span>
      </div>
      <div class="player-wave-row media-wave-row seek-surface"><time data-current>00:00</time><div class="wave-canvas media-seek-track"><canvas data-player-waveform height="54" aria-hidden="true"></canvas><div class="timeline-cues public-cues" data-player-cues></div><input data-seek type="range" min="0" max="1000" value="0" aria-label="Seek"></div><time data-duration>00:00</time></div>
      <button class="player-text" data-player-text type="button"><span data-text-previous></span><strong data-text-current></strong><span data-text-next></span></button>
    </div>
    <audio data-atlas-audio preload="metadata"></audio>
  </section>

  <dialog class="text-dialog" data-text-dialog aria-labelledby="text-dialog-title">
    <div class="text-dialog-heading"><h2 id="text-dialog-title" data-text-dialog-title>Track list</h2><div class="text-dialog-actions"><button class="icon-control text-copy" data-copy-lyrics type="button" aria-label="Copy lyrics" title="Copy lyrics" hidden><svg data-copy-icon aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="1"></rect><path d="M16 8V5H5v11h3"></path></svg><svg data-copy-success aria-hidden="true" viewBox="0 0 24 24" hidden><path d="m5 12 4 4L19 6"></path></svg><span class="sr-only" data-copy-lyrics-status aria-live="polite">Copy lyrics</span></button><form method="dialog"><button class="icon-control" aria-label="Close"><span aria-hidden="true">×</span></button></form></div></div>
    <div class="text-dialog-body" data-text-dialog-body></div>
  </dialog>

  <template id="media-card-template">
    <article class="media-card">
      <button class="cover-wrap media-artwork card-cover-load" type="button" aria-label="Load item"><img class="card-cover" src="" alt=""><span class="card-duration"></span></button>
      <div class="card-copy track-copy"><span class="card-kicker"></span><button class="card-title" type="button"></button><span class="card-subtitle"></span><span class="card-meta"><span class="card-played-at"></span><span class="card-location"></span></span><span class="card-tags"></span></div>
      <div class="card-actions"><a class="icon-control card-telegram" target="_blank" rel="noreferrer" aria-label="Open Telegram post"><img src="static/icon-telegram.svg" width="15" height="15" alt=""></a><button class="icon-control card-load play-control" type="button" aria-label="Play"><span></span></button></div>
    </article>
  </template>

  <script src="shared-ui.js?v=13"></script>
  <script src="atlas.js?v=68"></script>
</body>
</html>
